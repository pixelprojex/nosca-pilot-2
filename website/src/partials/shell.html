<!doctype html>
<html lang="en-IE" class="no-js" data-world="{{world}}" data-page="{{page}}" data-top="{{header}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="{{theme}}">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nosca">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="preload" href="fonts/InstrumentSans-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/InstrumentSans-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/site.css">
{{pageCss}}
<script>
/* Motion is only promised here; site.js confirms it. If the scripts fail, the finished page shows. */
(function (d, w) {
  var c = d.documentElement.classList; c.remove('no-js'); c.add('js');
  var ok = w.matchMedia && !w.matchMedia('(prefers-reduced-motion: reduce)').matches && !w.matchMedia('(max-height: 440px)').matches &&
    w.CSS && CSS.supports && CSS.supports('position', 'sticky') && 'IntersectionObserver' in w;
  w.__siteOff = function () { c.remove('motion'); c.add('motion-off'); };
  if (ok) { c.add('motion'); w.__siteFail = setTimeout(w.__siteOff, 6000); }
})(document, window);
</script>
<script defer src="vendor/gsap.min.js" onerror="__siteOff()"></script>
<script defer src="vendor/ScrollTrigger.min.js" onerror="__siteOff()"></script>
<script defer src="vendor/SplitText.min.js" onerror="__siteOff()"></script>
<script defer src="vendor/lenis.min.js"></script>
<script defer src="js/site.js" onerror="__siteOff()"></script>
{{pageJs}}
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<!-- @include defs -->
<!-- @include header -->
<main id="main">
{{content}}
</main>
<!-- @include footer -->
</body>
</html>
