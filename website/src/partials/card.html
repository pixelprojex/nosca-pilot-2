<div class="bcard {{class}}" data-world="{{world}}" {{attrs}}>
  <div class="bcard__flip">
    <div class="bcard__face bcard__front" role="img" aria-label="The front of the Nosca business card: gold pinstripes in two corners, the two woven rings and NOSCA in gold" {{frontattrs}}>
      <!-- @include pins attrs="{{pinsattrs}}" -->
      <div class="bcard__lock" aria-hidden="true"><!-- @if weave --><!-- @include weave class="bcard__mark" foil="d" --><!-- @else --><!-- @include mark class="bcard__mark" foil="d" --><!-- @endif --><span class="wordmark bcard__word">NOSCA</span></div>
      <i class="sheen" aria-hidden="true"></i>
    </div>
    <div class="bcard__face bcard__back">
      <!-- @include mark class="bcard__bmark" foil="1" -->
      <span class="wordmark bcard__bword" aria-hidden="true">NOSCA</span>
      <i class="bcard__rule" aria-hidden="true"></i>
      <p class="bcard__name">Fionn Breathnach</p>
      <p class="bcard__role">Founder</p>
      <p class="bcard__lines">Coaching, linked.<br>One app for coach, player and parent.</p>
      <div class="bcard__code"><!-- @include qr class="" --><span>Scan to start</span></div>
      <p class="bcard__sports">Golf · Tennis · Rowing · Squash · Padel · Equestrian</p>
      <i class="sheen" aria-hidden="true"></i>
    </div>
  </div>
</div>
