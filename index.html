<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- THE SIGNPOST. The printed business cards carry the site's first
         address in their code, and ink cannot be changed. That address is
         a signpost now: whatever page of it is opened, the same page of
         the app's own address opens instead (the card's /install above
         all — an app added to a Home Screen lives at the address it was
         added from) — but only once that address WORKS. The hop first
         asks it for /ready.png, a picture only a build given its database
         writes (vite.config.js); a picture loads across sites where a
         fetch may not, and anything but a picture (a build without its
         Supabase settings, the site down, a login wall in front of it, no
         network) leaves the person on this address, which still carries
         the whole app.
         So a card can never land on a dead page, and the hop switches
         itself on, with no deploy, the moment the new address is well.
         Only this one host hops; a deploy preview, a branch deploy and
         localhost are other hosts and stay where they are. Change either
         name here and in netlify/functions/lib/signpost.mjs together;
         scripts/e2e/signpost.cjs plays a scanned card, both ways. -->
    <!-- THE MOVE IS SEAMLESS (24 November). An app on a Home Screen is
         left where it is: iOS opens another address inside it as a sheet of
         browser, so it would bounce out on every open — it keeps working at
         the address it was added from. A browser tab carries the person
         across signed in: their session goes in the address's fragment the
         way Supabase's own email links carry one (the app reads it with
         detectSessionInUrl and clears it at once), but only while its access
         token has two minutes and more to run, so neither side refreshes it
         on the way; and the copy here is cleared as the tab goes, or this
         address would later hand over, or refresh, a token the app's own
         address has since rotated, and Supabase revokes the whole sign-in
         when a used token comes back. An email link that already carries a
         token in its fragment travels with its own, untouched. -->
    <script>
      (function (l) {
        if (l.hostname !== "nosca-pilot-2.netlify.app") return;
        if (navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)) return;
        var to = "https://nosca.netlify.app", over = false, probe = new Image();
        var carry = function () {
          try {
            if (/(^|[#&])(access_token|error_description|error)=/.test(l.hash)) return null;
            var s = JSON.parse(localStorage.getItem("nosca.auth") || "null");
            var left = s && s.expires_at ? s.expires_at - Math.round(Date.now() / 1000) : 0;
            if (!s || !s.access_token || !s.refresh_token || left < 120) return null;
            return "#access_token=" + encodeURIComponent(s.access_token) + "&refresh_token=" + encodeURIComponent(s.refresh_token) +
                   "&expires_in=" + left + "&expires_at=" + s.expires_at + "&token_type=bearer&type=signpost";
          } catch (e) { return null; }
        };
        probe.onload = function () {
          if (over) return; over = true;
          var hand = carry();
          if (hand) { try { localStorage.removeItem("nosca.auth"); } catch (e) {} }
          l.replace(to + l.pathname + l.search + (hand || l.hash));
        };
        probe.onerror = function () { over = true; };
        setTimeout(function () { over = true; }, 4000);
        probe.src = to + "/ready.png?signpost=" + Date.now();
      })(location);
    </script>
    <title>Nosca</title>
    <!-- the paper, not the brand: a phone paints the status bar and the browser chrome
         with it, and a green or cream band above a white app read as a blank strip -->
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nosca" />
  </head>
  <body style="margin:0; background:#FFFFFF;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
